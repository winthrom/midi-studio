name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Unit tests
        shell: pwsh
        run: |
          python -m pip install mido
          python test_audio_backend.py
          python test_app_resources.py

      - name: Fetch payload (FluidSynth DLLs + soundfont)
        shell: pwsh
        run: ./packaging/windows/fetch_payload.ps1

      - name: Build (PyInstaller)
        shell: pwsh
        run: ./packaging/windows/build_windows.ps1

      - name: Selftest the built bundle
        shell: pwsh
        run: |
          $out = & ./dist/windows/MIDI-Studio/MIDI-Studio-selftest.exe
          $out
          if ($LASTEXITCODE -ne 0) { throw "selftest reported FAIL" }
          $text = $out -join "`n"
          foreach ($need in "[OK  ] bundled libfluidsynth", "[OK  ] pyfluidsynth + libfluidsynth loads", "[OK  ] bundled soundfont", "[OK  ] soundfont loads") {
            if (-not $text.Contains($need)) { throw "selftest is missing: $need" }
          }

      - name: Zip (v22ze-192 clean layout with START HERE note)
        shell: pwsh
        run: |
          $stage = "stage/MIDI-Studio"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse dist/windows/MIDI-Studio $stage
          Remove-Item "$stage/MIDI-Studio-selftest.exe"
          Copy-Item docs/MIDI-Studio-User-Guide.pdf $stage
          $lines = @(
            "MIDI Studio - START HERE",
            "",
            "Windows opened this zip file like a folder, but nothing is installed yet.",
            "",
            "1. Click 'Extract all' at the top of this window, then click Extract.",
            "   (If you closed that window: find the zip in your Downloads folder, right-click it, choose Extract All.)",
            "2. Open the new folder that appears.",
            "3. Double-click MIDI-Studio.exe.",
            "",
            "Leave the _internal folder where it is; the program needs it.",
            "The User Guide (MIDI-Studio-User-Guide.pdf) is in this folder too.",
            "",
            "To remove the program later, delete this folder. If MIDI Studio downloaded LilyPond for you,",
            "it is in %LOCALAPPDATA%\MIDI-Studio\ly (type that into a File Explorer address bar); delete it too if you like.",
            "",
            "Windows may say 'Windows protected your PC' because this free program is not code-signed.",
            "Click the small 'More info' link, then 'Run anyway'.",
            "",
            "Please do not run MIDI-Studio.exe from inside the zip window."
          )
          Set-Content -Path "$stage/START HERE.txt" -Value $lines -Encoding ascii
          Compress-Archive -Path "$stage/*" -DestinationPath MIDI-Studio-windows-x64.zip

      - name: Installer (Inno Setup) - build, silent install test, uninstall test
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $ver = (Select-String -Path sys_platform.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $out = Join-Path (Get-Location).Path "installer-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/DMyAppVersion=$ver" "/O$out" packaging/windows/midi-studio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setup = Join-Path $out "MIDI-Studio-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installer was not produced" }
          $dir = Join-Path $env:RUNNER_TEMP "ms-install-test"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install failed (exit $($p.ExitCode))" }
          if (-not (Test-Path (Join-Path $dir "MIDI-Studio.exe"))) { throw "installed program is missing" }
          $un = Join-Path $dir "unins000.exe"
          if (-not (Test-Path $un)) { throw "uninstaller is missing" }
          # v22ze-199: seed a fake downloaded LilyPond and a settings file, then check the uninstaller
          # removes the first and keeps the second (silent uninstall: standard answers)
          $lyd = Join-Path $env:LOCALAPPDATA "MIDI-Studio\ly\lilypond-test\bin"
          New-Item -ItemType Directory -Force -Path $lyd | Out-Null
          Set-Content -Path (Join-Path $lyd "lilypond.exe") -Value "fake"
          $cfg = Join-Path $env:USERPROFILE ".midistudio_settings.json"
          $madeCfg = -not (Test-Path $cfg)
          if ($madeCfg) { Set-Content -Path $cfg -Value "{}" }
          $p = Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent uninstall failed (exit $($p.ExitCode))" }
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir "MIDI-Studio.exe")) { throw "uninstall left the program behind" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "MIDI-Studio\ly")) { throw "uninstall left the downloaded LilyPond behind" }
          if (-not (Test-Path $cfg)) { throw "uninstall removed the settings file (silent uninstall must keep it)" }
          if ($madeCfg) { Remove-Item $cfg -Force }
          Copy-Item $setup MIDI-Studio-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Studio-windows-installer
          path: MIDI-Studio-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Studio-windows-x64
          path: MIDI-Studio-windows-x64.zip
