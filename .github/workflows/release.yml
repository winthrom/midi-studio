name: Release

# Publish with:   git tag v0.2 && git push origin v0.2
on:
  push:
    tags: ["v*"]

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  linux:
    uses: ./.github/workflows/linux.yml

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: MIDI-Studio-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dl
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          cat > notes.md <<EOF
          Test build $GITHUB_REF_NAME. Download the file for your computer:

          - **Windows 10 / 11 (64-bit), easiest:** [MIDI-Studio-Setup.exe]($BASE/MIDI-Studio-Setup.exe)
          - **Windows 10 / 11 (64-bit), no install:** [MIDI-Studio-windows-x64.zip]($BASE/MIDI-Studio-windows-x64.zip)
          - **Linux (64-bit):** [MIDI-Studio-x86_64.AppImage]($BASE/MIDI-Studio-x86_64.AppImage)
          - **User Guide (PDF):** [MIDI-Studio-User-Guide.pdf]($BASE/MIDI-Studio-User-Guide.pdf)
          - **Mac:** not available yet.

          **Windows, easiest:** download MIDI-Studio-Setup.exe and double-click it. It installs for your user only (no administrator password) and can put an icon on your desktop. Windows will probably show a window titled "Windows protected your PC" because this program is not code-signed (it says the publisher is unknown). Click the small "More info" link, then "Run anyway".
          
          **Windows, without installing:** download the zip, right-click it, choose Extract All, open the new folder and double-click MIDI-Studio.exe. Do not run it from inside the zip window.

          **Linux:** after downloading, make the file runnable (right-click, Properties, Allow executing as program, or run chmod +x MIDI-Studio-x86_64.AppImage), then double-click it.

          The first start can take a while on older computers while the sounds load.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MIDI Studio $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dl/MIDI-Studio-Setup.exe dl/MIDI-Studio-windows-x64.zip dl/MIDI-Studio-x86_64.AppImage \
            docs/MIDI-Studio-User-Guide.pdf
