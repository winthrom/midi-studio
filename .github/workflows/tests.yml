name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Ubuntu is the real check.  macOS (Phase 3) and Windows are experimental:
    # they are run and reported, but a failure there does not fail the run.
    continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)   # v22ze-230: only what the unit tests need
      if: runner.os == 'Linux'
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: |
        sudo apt-get update
        sudo -E timeout 480 apt-get install -y --no-install-recommends python3-tk || true

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install fluidsynth portaudio || true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pylint

    - name: Install package
      run: |
        pip install -e . || pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --tb=short

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
