name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk timidity fluidsynth fluid-soundfont-gm portaudio19-dev || sudo apt-get install -y python3-tk timidity fluidsynth fluid-soundfont-gm libportaudio2-dev || true

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install python-tk timidity fluidsynth portaudio

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install python-tk timidity fluidsynth portaudio -y || true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pylint

    - name: Install package
      run: |
        pip install -e . || pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --tb=short

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
