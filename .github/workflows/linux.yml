name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache libfluidsynth build
        id: libcache
        uses: actions/cache@v5
        with:
          path: packaging/linux/payload/lib
          key: linux-libs-${{ hashFiles('packaging/linux/build_fluidsynth.sh', 'packaging/linux/collect_libs.sh') }}

      - name: Build libfluidsynth (old-glibc container)
        if: steps.libcache.outputs.cache-hit != 'true'
        run: bash packaging/linux/docker_build_fluidsynth.sh

      - name: Fetch soundfont
        run: bash packaging/linux/fetch_soundfont.sh

      - name: Add the Lions emblem (official builds only; skipped when the secret is not set)
        env:
          LIONS_EMBLEM_B64: ${{ secrets.LIONS_EMBLEM_B64 }}
        run: |
          if [ -n "$LIONS_EMBLEM_B64" ]; then echo "$LIONS_EMBLEM_B64" | base64 -d > lions_emblem.png; echo "emblem added"; else echo "no emblem secret: building without the emblem"; fi

      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packaging/linux/docker_build.sh

      - name: Selftest the AppImage
        run: |
          chmod +x dist/linux/MIDI-Studio-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          set +e
          out="$(dist/linux/MIDI-Studio-x86_64.AppImage --selftest 2>&1)"
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 0 ] || { echo "selftest reported FAIL"; exit 1; }
          for need in "[OK  ] bundled libfluidsynth" "[OK  ] pyfluidsynth + libfluidsynth loads" "[OK  ] bundled soundfont" "[OK  ] soundfont loads"; do
            echo "$out" | grep -qF "$need" || { echo "selftest is missing: $need"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: MIDI-Studio-linux-x86_64
          path: dist/linux/MIDI-Studio-x86_64.AppImage

  publish-dev:
    # a public download for testers without a GitHub login; main branch pushes only, never tagged releases
    needs: appimage
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MIDI-Studio-linux-x86_64
          path: dl
      - name: Update the rolling "dev-build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dl
          test -f dl/MIDI-Studio-x86_64.AppImage
          NOTES="Development build (untested, not for everyday use) from commit ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d). This is the program as it is being worked on and it may have faults. For everyday use download the latest release instead. Windows: MIDI-Studio-Setup.exe (install) or MIDI-Studio-windows-x64.zip (no install). Linux: MIDI-Studio-x86_64.AppImage. The User Guide PDF is the current one. Windows shows unknown publisher because the build is not signed. This page is replaced by each newer good build. Please report problems with Help > Send a Problem Report."
          if ! gh release create dev-build --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Development build (rolling, untested)" --notes "$NOTES" 2>/dev/null; then
            gh release edit dev-build --repo "$GITHUB_REPOSITORY" --prerelease --title "Development build (rolling, untested)" --notes "$NOTES"
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev-build" -f sha="$GITHUB_SHA" -F force=true || true
          gh release upload dev-build dl/MIDI-Studio-x86_64.AppImage --repo "$GITHUB_REPOSITORY" --clobber
